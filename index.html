(function(){var state=window.__seatState||{players:[],judge:null};window.__seatState=state;function id(x){return document.getElementById(x)}function ensureSeats(){var l=id('leftSeats'),r=id('rightSeats');if(!l||!r)return;function make(n,o){var h='';for(var i=0;i<n;i++){var k=o+i,p=state.players[k];h+='<div><div class="seat '+(p?'filled':'')+'" data-seat-index="'+k+'">'+(p?p.avatar:'+')+'</div><div class="seat-name">'+(p?p.name:'空席')+'</div></div>'}return h}l.innerHTML=make(5,0);r.innerHTML=make(5,5);bindSeats()}function openPicker(index,isJudge){var modal=id('pickModal'),list=id('pickList');if(!modal||!list)return;list.innerHTML='';var source=window.__personaChoices||[];if(!source.length)source=[{name:'AI 1',avatar:'AI'},{name:'AI 2',avatar:'AI'},{name:'AI 3',avatar:'AI'}];source.forEach(function(p,i){var b=document.createElement('button');b.className='ghost pick-choice';b.textContent=(p.avatar||'AI')+' '+p.name;b.onclick=function(){if(isJudge){state.judge=p;var n=id('judgeName');if(n)n.textContent=p.name;var o=id('judgeOrb');if(o)o.textContent=p.avatar||'AI'}else{state.players[index]=p;ensureSeats()}modal.classList.remove('open')};list.appendChild(b)});modal.classList.add('open')}function bindSeats(){document.querySelectorAll('[data-seat-index]').forEach(function(s){s.onclick=function(){openPicker(Number(s.dataset.seatIndex),false)}})}document.addEventListener('click',function(e){var t=e.target;if(t&&t.closest){var seat=t.closest('[data-seat-index]');if(seat){openPicker(Number(seat.dataset.seatIndex),false)}var orb=t.closest('#judgeOrb');if(orb){openPicker(-1,true)}}if(t&&t.id==='cancelPick')id('pickModal').classList.remove('open')});var obs=new MutationObserver(ensureSeats);obs.observe(document.body,{childList:true,subtree:true});setTimeout(ensureSeats,0)})();
</script>

<script>(function(){var store=window.__importedModels||[];window.__importedModels=store;function id(x){return document.getElementById(x)}function add(){var e=id('endpoint'),n='gpt-4o-mini';if(!store.some(function(m){return m.name===n}))store.push({name:n,endpoint:e?e.value:''})}function all(){if(store.length)return store;var l=id('modelList'),a=[];if(l)l.querySelectorAll('b').forEach(function(x){a.push({name:x.textContent})});return a}function choose(done){var a=all(),l=id('pickList'),m=id('pickModal');if(!a.length){alert('请先在模型接入页面拉取模型');return}l.innerHTML='';a.forEach(function(x){var b=document.createElement('button');b.className='ghost model-choice';b.textContent=x.name;b.onclick=function(){done(x);m.classList.remove('open')};l.appendChild(b)});m.classList.add('open')}document.addEventListener('click',function(e){var t=e.target;if(!t)return;if(t.id==='fetchModels')setTimeout(add,0);var s=t.closest&&t.closest('.seat');if(s)choose(function(x){s.classList.add('filled');s.textContent='AI';var n=s.parentElement.querySelector('.seat-name');if(n)n.textContent=x.name});if(t.id==='aiJudge')choose(function(x){id('judgeName').textContent=x.name;id('judgeOrb').textContent='AI'})});function show(){var b=id('spectators');if(!b)return;b.classList.add('spectator-mobile');if(!b.children.length){var a=all().slice(0,3);b.innerHTML=a.map(function(x){return '<div class="spectator-item"><div class="avatar">AI</div>'+x.name+'<br><small>观战</small></div>'}).join('')||'<span class="meta">导入模型后可添加观众</span>'}}setInterval(show,800)})();</script>
