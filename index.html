<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星路制作人 - 真实乐坛重制版</title>
<style>
/* 基础与排版 (已压缩以节省空间) */
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, sans-serif;}
body{background:#f5f5f7;color:#111;max-width:480px;margin:0 auto;padding:15px;padding-top:60px;padding-bottom:100px;min-height:100vh;}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.tg{color:#c8a440;font-weight:bold;}
.top-bar{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;align-items:center;padding:0 15px;z-index:100;max-width:480px;margin:0 auto;}
.top-time{font-size:13px;font-weight:bold;} .top-energy{font-size:12px;font-weight:bold;color:#c8a440;}
.top-btn{background:#c8a440;color:#000;border:none;padding:5px 10px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer;}
button{background:#c8a440;color:#000;padding:12px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;width:100%;margin-bottom:8px;}
button.sec{background:#f0e9d0;color:#333;} button.red{background:#fee2e2;color:#991b1b;}
button.inline{width:auto;padding:6px 12px;font-size:12px;margin:0 0 0 5px;}
input,select,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #d1c290;border-radius:8px;font-size:13px;outline:none;}
.ai-input-group {display:flex;gap:5px;margin-bottom:10px;} .ai-input-group input {margin-bottom:0;flex:1;}
.log{min-height:40px;white-space:pre-wrap;padding:10px;border:1px solid #d1c290;background:#fefcf5;font-size:12px;border-radius:8px;line-height:1.5;}
.page,.tab-page,.sub-page{display:none;} .active{display:block;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #ddd;padding:10px 5px;z-index:99;max-width:480px;margin:0 auto;}
.nav-btn{flex:1;padding:12px 2px;border-radius:8px;background:#fff;font-size:12px;font-weight:bold;cursor:pointer;text-align:center;color:#666;} .nav-btn.active{background:#c8a440;color:#000;}
.sub-tab-bar{display:flex;gap:5px;margin-bottom:15px;overflow-x:auto;} .sub-tab{padding:8px 12px;border:1px solid #d1c290;border-radius:20px;cursor:pointer;font-size:12px;background:#fff;white-space:nowrap;} .sub-tab.active{background:#c8a440;color:#000;}
.attr-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f0e0;font-size:13px;}
.attr-bar-wrap{flex:1;margin:0 10px;height:8px;background:#f0e9d0;border-radius:4px;} .attr-bar-fill{height:100%;background:#c8a440;border-radius:4px;}
.g-tag{display:inline-block;padding:4px 10px;border:1px solid #d1c290;border-radius:20px;margin:3px;cursor:pointer;font-size:11px;background:#fff8e8;} .g-tag.selected{background:#c8a440;color:#000;}
.phone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:5px;}
.app-icon{height:65px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold;cursor:pointer;}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;font-size:13px;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center;padding:15px;} .modal.open{display:flex;}
.modal-box{background:#fff;width:100%;max-width:420px;border-radius:16px;padding:20px;position:relative;max-height:85vh;overflow-y:auto;}
.modal-x{position:absolute;top:10px;right:10px;background:#fee2e2;color:#991b1b;padding:6px 12px;border-radius:6px;font-size:12px;width:auto;margin:0;z-index:10;}
.prog-wrap{width:100%;height:14px;border:1px solid #d1c290;border-radius:8px;background:#fefcf5;margin-bottom:10px;overflow:hidden;} .prog-fill{height:100%;background:#c8a440;transition:width 0.3s;}
.rank-up{color:#008000;font-size:11px;} .rank-down{color:#ff0000;font-size:11px;} .rank-new{color:#0055ff;font-size:11px;}
</style>
</head>
<body>

<div class="top-bar" id="topBar" style="display:none;">
  <div class="top-time"><span id="uiDate">2026年 1月 第1周</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="top-energy">⚡ 精力: <span id="uiEnergy">100</span></span>
    <button class="top-btn" onclick="advTimeByFlow()">推演时间</button>
  </div>
</div>

<div id="createPage" class="page active">
  <div class="card" style="margin-top:20px;text-align:center;">
    <h2 class="tg" style="font-size:24px;margin-bottom:20px;">星路制作人</h2>
    <div id="gameStartBox">
        <input id="inRealName" placeholder="真实姓名 (必填)" style="text-align:center;">
        <input id="inStageName" placeholder="艺名" style="text-align:center;">
        <input id="inFanName" placeholder="粉丝群体名称" style="text-align:center;">
        <input id="inGender" placeholder="性别" style="text-align:center;">
        <button id="btnCreate" onclick="startGame()">✓ 创建并进入演艺圈</button>
        <div style="margin-top:20px;border-top:1px solid #eee;padding-top:15px;">
          <div style="display:flex;gap:5px;">
            <button class="sec" onclick="loadGame(1)">读档 1</button>
            <button class="sec" onclick="loadGame(2)">读档 2</button>
          </div>
        </div>
    </div>
  </div>
</div>

<div id="gameMain" class="page">
  <div id="pAttr" class="tab-page active">
    <div class="card">
      <div id="boxBasic" style="font-size:13px;line-height:2;margin-bottom:10px;"></div>
      <div style="display:flex;justify-content:space-between;margin:10px 0;"><b class="tg">⬡ 八维能力</b></div>
      <div id="boxBars"></div>
    </div>
  </div>

  <div id="pApi" class="tab-page">
    <div class="card"><h2 class="tg">💾 系统管理</h2><button class="sec" onclick="saveGame()">手动保存</button><button class="red" onclick="location.reload()">退出至主菜单</button></div>
    <div class="card">
      <h2 class="tg">🤖 AI 接口设定</h2>
      <input id="apiHost" placeholder="API 端点 (如 https://api.openai.com/v1)">
      <input id="apiToken" type="password" placeholder="API Key">
      <input id="apiModel" placeholder="模型名 (如 gpt-3.5-turbo)">
      <button onclick="saveApiConfig()">保存配置</button>
    </div>
  </div>

  <div id="pMap" class="tab-page">
    <div class="card">
      <h2 class="tg" style="margin-bottom:10px;">🌍 娱乐圈地图</h2>
      <button class="sec" onclick="showMap('mapLabel')">🏢 唱片公司</button>
      <button class="sec" onclick="showMap('mapMarket')">🛒 买歌中心 / 创作者榜单</button>
      <button class="sec" onclick="showMap('mapFashion')">✨ 国际四大时装周</button>
      <button class="sec" onclick="showMap('mapHome')">🏠 我的家 (聚会)</button>
      
      <!-- 唱片公司 (已修复前置条件提示) -->
      <div id="mapLabel" class="card" style="display:none;margin-top:15px;">
        <div id="boxSignCompany"><h3 class="tg">🏢 唱片公司签约</h3><p style="font-size:12px;color:#888;">需满足属性要求 OR 粉丝人气达标</p><div id="listLabel" style="margin-top:10px;"></div></div>
        <div id="boxMyCompany" style="display:none;"><h3 class="tg">🏢 我的公司</h3><button class="sec" onclick="alert('解约功能开发中')">提出解约</button></div>
      </div>

      <!-- 四大时装周 -->
      <div id="mapFashion" class="card" style="display:none;margin-top:15px;">
        <h3 class="tg">✨ 国际时装周</h3>
        <p style="font-size:12px;color:#888;">每年固定月份开启。若名气不足可自费参加。</p>
        <button class="sec" onclick="joinFashion('纽约')">🗽 纽约时装周 (2月/9月)</button>
        <button class="sec" onclick="joinFashion('伦敦')">💂 伦敦时装周 (2月/9月)</button>
        <button class="sec" onclick="joinFashion('米兰')">🍕 米兰时装周 (2月/9月)</button>
        <button class="sec" onclick="joinFashion('巴黎')">🥐 巴黎时装周 (3月/10月)</button>
      </div>

      <!-- 买歌中心 -->
      <div id="mapMarket" class="card" style="display:none;margin-top:15px;">
        <h3 class="tg">🛒 交易市场</h3>
        <button class="sec" onclick="showWriterBoard()" style="margin-bottom:15px;">🏆 查看金牌写手榜单</button>
        <div id="marketSongList" style="font-size:13px;">每月刷新随机歌曲...</div>
      </div>

      <!-- 我的家 -->
      <div id="mapHome" class="card" style="display:none;margin-top:15px;">
        <h3 class="tg">🏠 我的家</h3>
        <button onclick="relaxHome()">🧘 放空休息 (回精力)</button>
        <button onclick="openInviteList()">☕ 邀请好友聚会/互动</button>
      </div>
    </div>
  </div>

  <div id="pProj" class="tab-page">
    <div class="card">
      <h2 class="tg" style="margin-bottom:10px;">💡 企划中心</h2>
      <button class="sec" onclick="showProj('pjSingle')">🎵 创作单曲</button>
      <button class="sec" onclick="showProj('pjAlbum')">💿 专辑企划</button>

      <div id="pjSingle" class="card" style="display:none;margin-top:15px;">
        <h3 class="tg">单曲立项</h3>
        <div class="ai-input-group">
          <input id="inSName" placeholder="歌名">
          <button class="sec inline" onclick="randomGenName('inSName')">🎲 随机</button>
          <button class="sec inline" onclick="aiGenName('song', 'inSName', this)">🤖 AI</button>
        </div>
        <button id="btnStartWriteProj" onclick="startWrite()">开始创作</button>
      </div>

      <div id="pjAlbum" class="card" style="display:none;margin-top:15px;">
        <h3 class="tg">专辑立项</h3>
        <div class="ai-input-group">
          <input id="inAName" placeholder="专辑名">
          <button class="sec inline" onclick="randomGenName('inAName')">🎲 随机</button>
          <button class="sec inline" onclick="aiGenName('album', 'inAName', this)">🤖 AI</button>
        </div>
        <button onclick="startAlbum()">建立专辑文件夹</button>
      </div>
    </div>
  </div>

  <div id="pPhone" class="tab-page"><div class="card"><h2 class="tg">📱 手机桌面</h2><div class="phone-grid" id="phoneGrid"></div></div></div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchMainTab(this, 'pAttr')">档案</button>
    <button class="nav-btn" onclick="switchMainTab(this, 'pApi')">系统</button>
    <button class="nav-btn" onclick="switchMainTab(this, 'pMap')">地图</button>
    <button class="nav-btn" onclick="switchMainTab(this, 'pProj')">企划</button>
    <button class="nav-btn" onclick="switchMainTab(this, 'pPhone')">手机</button>
  </div>
</div>

<!-- 各种弹窗 -->
<div class="modal" id="mText"><div class="modal-box"><button class="modal-x" onclick="closeM('mText')">X</button><h3 class="tg" id="mTextTitle">社交平台</h3><textarea id="mTextInput" style="height:70px;" placeholder="发点什么..."></textarea><button onclick="postSocial()">发送</button><div id="mTextList" style="margin-top:10px;font-size:13px;"></div></div></div>
<div class="modal" id="mInfo"><div class="modal-box"><button class="modal-x" onclick="closeM('mInfo')">X</button><h3 class="tg" id="mInfoTitle">排行榜</h3><div id="mInfoContent" style="max-height:60vh;overflow-y:auto;"></div></div></div>
<div class="modal" id="mCustomNPC"><div class="modal-box"><button class="modal-x" onclick="closeM('mCustomNPC')">X</button><h3 class="tg">自定义艺人注入</h3><input id="aNpcName" placeholder="姓名"><input id="aNpcGender" placeholder="性别"><input id="aNpcFans" type="number" placeholder="初始粉丝数(设0为素人)"><button onclick="submitCustomNPC()">注入大盘</button></div></div>
<script>
function escapeHTML(str) { if(!str) return ''; return String(str).replace(/[&<>'"]/g, function(tag){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag; }); }

// ==================== 全局变量 ====================
const GAME_VERSION = "2.6.0"; 
const $ = function(id) { return document.getElementById(id); };
let ad={}; let lib=[]; let std=[]; let albs=[]; let trackPool=[]; let marketSongs=[]; let worldArtists=[]; let writers=[]; let myWorks=[];
let selG=[]; let selAG=[]; let posts={Wb:[],X:[],Ins:[],TikTok:[]}; let curApp="";
let time = { y:2026, m:1, w:1, d:1, h:0 }; let Mt = 1.0; 
let curPj = null; let prog = 0; let curAlbPj = null; 
let pickAction = ""; let tempIdx = -1;
const gs=["流行","舞曲","摇滚","R&B","HipHop","电子","乡村","另类","灵魂乐"];
const npcNames=["Elara","Jaxon","Seraphina","Kael","Lyra","Orion","Calliope","Zephyr","Maeve","Caspian","Aria","Nova","Luna","Silas","Felix"];
let coList = []; let historyAwards = [];
let conts=[{id:1,n:"经纪人",t:"工作伙伴",h:[],affinity:30}];
const aKs=[{k:"v",n:"唱功"},{k:"d",n:"舞蹈"},{k:"r",n:"Rap"},{k:"w",n:"创作"},{k:"f",n:"颜值"},{k:"s",n:"台风"},{k:"fa",n:"时尚"},{k:"va",n:"综艺"}];

// ==================== 存档与基础 ====================
function getSaveKey(){ return "starProSave_" + ($("selSaveSlot")?$("selSaveSlot").value:"1"); }
window.saveGame = function(){
  try {
      let s = { version: GAME_VERSION, ad:ad, lib:lib, std:std, albs:albs, trackPool:trackPool, marketSongs:marketSongs, time:time, Mt:Mt, posts:posts, curPj:curPj, prog:prog, curAlbPj:curAlbPj, historyAwards:historyAwards, conts:conts, worldArtists:worldArtists, writers:writers, myWorks:myWorks };
      localStorage.setItem(getSaveKey(), JSON.stringify(s));
  } catch(e) { console.log("存档超限或失败", e); }
}
window.loadGame = function(slotOverride){
  let k = slotOverride ? "starProSave_"+slotOverride : getSaveKey();
  let s = localStorage.getItem(k); if(!s) return alert("未找到该存档！");
  try {
      let data = JSON.parse(s);
      ad=data.ad; lib=data.lib||[]; std=data.std||[]; albs=data.albs||[]; trackPool=data.trackPool||[]; marketSongs=data.marketSongs||[]; time=data.time; Mt=data.Mt; posts=data.posts||{Wb:[],X:[],Ins:[],TikTok:[]}; curPj=data.curPj; prog=data.prog; curAlbPj=data.curAlbPj; historyAwards=data.historyAwards||[]; conts=data.conts||[]; worldArtists=data.worldArtists||[]; writers=data.writers||[]; myWorks=data.myWorks||[];
      initCos(); initPhone(); updTimeUI(); updAttr(); updateFeatList(); renderMapCompany(); genMarket(false);
      $("createPage").classList.remove("active"); $("gameMain").classList.add("active"); $("topBar").style.display="flex"; 
      alert("🎉 读取成功！欢迎回来。");
  } catch (err) { alert("存档可能已损坏！"); }
}

window.startGame = function(){
  let rName = $("inRealName").value.trim(); if(!rName) return alert("❌ 必须填写真实姓名！");
  let btn = $("btnCreate"); if(btn) { btn.disabled = true; btn.innerText = "⏳ 正在生成娱乐圈大盘，请稍候..."; }

  // 缓冲0.5秒防止手机黑屏假死
  setTimeout(() => {
      try {
          ad={ r: escapeHTML(rName), s: escapeHTML($("inStageName").value.trim())||escapeHTML(rName), g: escapeHTML($("inGender").value.trim())||"保密", co:"独立", cot:"indie", m:50000, H:1.0, D:1.0, Elead:1.0, Kalbum:1.0, Geffect: 0.55, st:{f:5000,h:10}, sk:{v:50,d:50,r:50,w:50,f:50,s:50,fa:50,va:50}, ws:[], awd:[], shows:[], contractEnd:0, energy: 100, maxEnergy: 100 };
          trackPool=[]; myWorks=[]; curPj=null; prog=0; curAlbPj=null; historyAwards=[]; lib=[]; std=[]; worldArtists=[]; writers=[]; conts=[{id:1,n:"经纪人",t:"工作伙伴",h:[],affinity:30}];
          
          initCos(); initPhone(); initNPCs(); genMarket(true); updAttr(); updTimeUI(); renderMapCompany();
          $("createPage").classList.remove("active"); $("gameMain").classList.add("active"); $("topBar").style.display="flex"; 
          saveGame();
          alert("🎉 娱乐圈生成完毕，出道成功！");
      } catch (err) {
          alert("生成大盘时出错: " + err.message);
      } finally {
          if(btn) { btn.disabled = false; btn.innerText = "✓ 创建并进入演艺圈"; }
      }
  }, 500);
}

function initCos(){ coList = [{n:"UMG", l:"T0", m:500000, f:2000000, attr:90}, {n:"SME", l:"T0", m:450000, f:2000000, attr:90}, {n:"WMG", l:"T0", m:400000, f:2000000, attr:90}, {n:"Nova Records", l:"T1", m:200000, f:800000, attr:80}, {n:"Echo Sound", l:"T2", m:80000, f:300000, attr:70}]; }

function initPhone(){
  let phtml="";
  [ {i:'Wb',c:'📢',bg:'#ff8a00',n:'Weibo'},{i:'Ins',c:'📷',bg:'#e6683c',n:'Ins'},{i:'X',c:'𝕏',bg:'#111',n:'X'},{i:'TikTok',c:'🎵',bg:'#000',n:'TikTok'},{i:'BB',c:'📊',bg:'#cc0000',n:'热百榜'},{i:'Album',c:'💿',bg:'#8b5cf6',n:'专辑榜'},{i:'Spot',c:'🎧',bg:'#1db954',n:'流媒榜'}].forEach(a=>{ phtml+=`<div class="app-icon" style="background:${a.bg}" onclick="openApp('${a.i}')"><div class="picon" style="font-size:20px;">${a.c}</div>${a.n}</div>`});
  $("phoneGrid").innerHTML = phtml;
}

// ==================== 大盘与NPC生成 (新增10~20人) ====================
function initNPCs(){
  worldArtists = []; writers = [];
  let count = Math.floor(Math.random() * 11) + 10; 
  for(let i=0; i<count; i++){
    let art = npcNames[i % npcNames.length] + (i>npcNames.length?"_"+i:""); 
    let f = Math.floor(Math.random()*5000000)+10000;
    worldArtists.push({id:"npc_"+i, n:art, fans:f});
    trackPool.push(createEntity(art+"的单曲", art, false, "track", f, 60, 60));
  }
  for(let i=0; i<15; i++) writers.push({n:"作词人_"+npcNames[i%10]+i, sk:Math.floor(Math.random()*50)+50, hot:Math.floor(Math.random()*100)});
  updatePeakRanks(); updateFeatList();
}

function createEntity(name, artist, isMe, type, fans, C, V){
  let Seval = Math.min(100, Math.max(10, (C*0.55 + ((Math.random()*20)-10))*((Math.random()*0.4)+0.8) + V*0.25)); 
  let baseStm = Math.floor((fans*0.1 + 10000) * (Seval>=80?1.3:1.0) * Mt);
  if(type==="album") baseStm *= 5; 
  return { id: "tk_"+Date.now()+"_"+Math.floor(Math.random()*10000), n: escapeHTML(name), artist: escapeHTML(artist), isMe: isMe, type: type, y: time.y, m: time.m, w: time.w, stm: baseStm, stmDly: Math.floor(baseStm/7), slTotal: Math.floor(baseStm/150), slWk: Math.floor(baseStm/150), rad: Math.floor(baseStm*1.5), pts: 0, days: 1, weeks: 1, peakS: 999, peakB: 999, peakW: 0, lastW: 0, isSleeping: false, isDead: false, price: 1 };
}

window.updateFeatList = function(){ 
    let el = $("inFeat");
    if(el) el.innerHTML = '<option value="">🎤 Solo (独唱)</option>' + worldArtists.map(a => `<option value="${a.n}">与 ${a.n} 合作</option>`).join(''); 
}
window.submitCustomNPC = function(){ 
    let n = $("aNpcName").value; if(!n) return; 
    let fans = parseInt($("aNpcFans").value) || 0; 
    worldArtists.push({id:"npc_"+Date.now(), n:n, fans:fans}); 
    alert(`注入成功！${n} 以 ${fans} 粉丝进入大盘！`); 
    updateFeatList(); closeM('mCustomNPC'); 
}

// ==================== 缺失的企划与创作功能补全 ====================
window.startWrite = function(){ 
    if(!costEnergy(10)) return; advHour(1);
    let n = $("inSName").value || "未命名单曲";
    lib.push({id:"lb_"+Date.now(), n:n, g:["流行"], c:"自编自填自唱"}); 
    alert(`✅ 单曲《${n}》灵感记录完毕，已存入曲库！`); saveGame(); 
}

window.startAlbum = function(){ 
    let n = $("inAName").value || "未命名专辑";
    albs.push({id:"alb_"+Date.now(), n:n, s:[]});
    alert(`💿 专辑文件夹【${n}】创建成功！\n注意：此功能界面还在扩建中，当前仅为占位体验。`); saveGame(); 
}

// ==================== 随机与AI起名 ====================
window.randomGenName = function(targetId) {
    let pool = ["夏日回音", "破碎的梦", "霓虹午夜", "星光陨落", "最后的舞", "幻昼", "野蛮生长", "无名之辈", "时间尽头", "失重空间", "心动法则"];
    $(targetId).value = pool[Math.floor(Math.random() * pool.length)];
}
window.aiGenName = async function(type, targetId, btn){ 
    btn.innerText="..."; 
    let r = await api(`请随机生成一个有创意的中文${type==='song'?'单曲':'专辑'}名，只要名字，不要任何标点和解释`); 
    btn.innerText="🤖 AI"; 
    if(r) $(targetId).value = r.trim().replace(/["']/g,""); 
}

// ==================== 市场与写手系统 ====================
function genMarket(force){
    if(!force && time.m % 2 !== 0) return;
    marketSongs = writers.sort(() => 0.5 - Math.random()).slice(0, 5).map(w => ({ n: "未命名Demo", author: w.n, price: Math.floor(w.sk*150 + w.hot*50) }));
    if($('mapMarket') && $('mapMarket').style.display === 'block') renderMarket();
}
function renderMarket(){
    if($("marketSongList")) $("marketSongList").innerHTML = marketSongs.map((s,i) => `<div class='card' style='display:flex;justify-content:space-between;align-items:center;'><span><b>${s.n}</b> <br><small>作词曲: ${s.author}</small></span> <button class='inline' onclick='buySong(${i})'>买断 $${s.price.toLocaleString()}</button></div>`).join('');
}
window.buySong = function(i){
    let s = marketSongs[i]; if(ad.m < s.price) return alert("资金不足！");
    ad.m -= s.price; lib.push({id:"lb_"+Date.now(), n:s.n, g:["流行"], c:"由 "+s.author+" 创作"}); 
    marketSongs.splice(i,1); renderMarket(); updAttr(); saveGame(); alert("🎉 购买成功，已加入个人曲库！");
}
window.showWriterBoard = function() {
    let html = writers.sort((a,b)=>b.sk - a.sk).map((w,i) => `<div class='row'><b>#${i+1} ${w.n}</b> <span>创作力: <b class='tg'>${w.sk}</b> | 热度: ${w.hot}</span></div>`).join('');
    $("mInfoTitle").innerText = "🏆 金牌写手排行榜"; $("mInfoContent").innerHTML = html; $("mInfo").classList.add("open");
}

// ==================== 唱片公司签约 ====================
window.renderMapCompany = function(){ 
    if(!$("boxSignCompany")) return;
    if(ad.co === "独立"){ 
        $("boxSignCompany").style.display = "block"; $("boxMyCompany").style.display = "none"; 
        $("listLabel").innerHTML = coList.map((c,i)=>`<div class="card"><b>${c.n} (${c.l})</b><br><span style="font-size:12px;color:#666">预付金: $${c.m.toLocaleString()} | 要求均属性:${c.attr} 或 粉丝:${c.f.toLocaleString()}</span><button class="inline sec" onclick="openSign(${i})" style="margin-top:5px;">申请签约</button></div>`).join('');
    } else { 
        $("boxSignCompany").style.display = "none"; $("boxMyCompany").style.display = "block"; 
    } 
}
window.openSign = function(i){ 
    let c = coList[i]; 
    let avgAttr = (ad.sk.v+ad.sk.d+ad.sk.r+ad.sk.w+ad.sk.f+ad.sk.s+ad.sk.fa+ad.sk.va)/8;
    if(avgAttr >= c.attr || ad.st.f >= c.f) {
        if(confirm(`恭喜！条件达标，是否确认签约 ${c.n}？\n将获得预付金 $${c.m.toLocaleString()}`)) {
            ad.co = c.n; ad.m += c.m; ad.st.f += Math.floor(c.f * 0.1);
            alert(`🎉 签约成功！人气大涨！`); updAttr(); renderMapCompany(); saveGame();
        }
    } else { alert(`❌ 试音失败！\n该公司要求：八维平均达到 ${c.attr}，或者 粉丝量达到 ${c.f.toLocaleString()}。您均未满足！`); }
}

// ==================== 四大时装周 ====================
window.joinFashion = function(city){ 
    let valid = ((city=='纽约'||city=='伦敦'||city=='米兰') && (time.m==2||time.m==9)) || (city=='巴黎' && (time.m==3||time.m==10));
    if(!valid) return alert(`❌ ${city}时装周仅在特定月份开幕，现在不是举办期！`);
    
    let isInvited = ad.sk.fa >= 80 || ad.st.f >= 1500000;
    if(!isInvited) {
        if(ad.m < 50000) return alert("❌ 未受邀，且自费参加需要 $50,000，您的资金不足！");
        if(!confirm("您的人气不足以获得品牌直邀。是否自费 $50,000 强行去蹭红毯？")) return;
        ad.m -= 50000;
    } else { alert("✉️ 您已收到品牌直邀，可免费出席VIP头排！"); }

    if(!costEnergy(10)) return; advHour(24); 
    ad.sk.fa = Math.min(100, ad.sk.fa + 5); ad.st.f += 5000;
    alert(`✨ 参加了${city}时装周，时尚感大幅提升，吸引了大量颜粉！`); updAttr(); saveGame(); 
}

// ==================== 聚会互动 ====================
window.openInviteList = function() {
    let html = conts.map(c => `<div class='row'><b>${c.n}</b> <span>好感: <b class='tg'>${c.affinity}</b></span> <button class='inline sec' onclick='doInvite(${c.id})'>邀请喝茶(耗5精)</button></div>`).join('');
    $("mInfoTitle").innerText = "☕ 聚会列表"; $("mInfoContent").innerHTML = html; $("mInfo").classList.add("open");
}
window.doInvite = function(id) {
    if(!costEnergy(5)) return; advHour(2);
    let c = conts.find(x=>x.id===id); c.affinity += Math.floor(Math.random()*5)+2;
    alert(`和 ${c.n} 度过了愉快的时光，好感度增加了！`); openInviteList(); saveGame();
}

// ==================== 社交媒体：发帖与发视频 ====================
window.openApp = function(id){
  if(['Wb','X','Ins','TikTok'].includes(id)){ 
      curApp = id; $("mText").classList.add("open"); $("mTextTitle").innerText = id + " 社交中心";
      renderSocialTabs('feed');
  } else if(id=='BB'){ 
      $("mInfoTitle").innerText = "📊 Billboard 综合榜"; $("mInfoContent").innerHTML = trackPool.filter(x=>x.type=="track" && !x.isSleeping && !x.isDead).sort((a,b)=>b.pts-a.pts).slice(0, 100).map((x,i)=>renderRankRow(x,i,"pts","Pts")).join(''); $("mInfo").classList.add("open");
  } else if(id=='Spot'){ 
      $("mInfoTitle").innerText = "🎧 Spotify 流媒榜"; $("mInfoContent").innerHTML = trackPool.filter(x=>x.type=="track" && !x.isDead).sort((a,b)=>b.stmDly-a.stmDly).slice(0, 50).map((x,i)=>renderRankRow(x,i,"stmDly","播放")).join(''); $("mInfo").classList.add("open");
  } else if(id=='Album'){ 
      $("mInfoTitle").innerText = "💿 实体专辑销量榜"; $("mInfoContent").innerHTML = trackPool.filter(x=>x.type=="album" && !x.isDead).sort((a,b)=>b.slWk-a.slWk).slice(0, 50).map((x,i)=>renderRankRow(x,i,"slWk","张 (周增)")).join(''); $("mInfo").classList.add("open");
  }
}

window.renderSocialTabs = function(tab) {
    let content = "";
    let nav = `<div style="display:flex;gap:5px;margin-bottom:10px;"><button class="${tab==='feed'?'':'sec'}" onclick="renderSocialTabs('feed')">首 页</button><button class="${tab==='trend'?'':'sec'}" onclick="renderSocialTabs('trend')">热 搜</button><button class="${tab==='profile'?'':'sec'}" onclick="renderSocialTabs('profile')">个 人</button></div>`;
    
    if(tab === 'feed') content = `<div class='card'>加载出几条网友的热门讨论...</div><div class='card'>某明星被拍到出街！</div>`;
    if(tab === 'trend') content = `<div class='card'># 热搜第一：时装周绝美红毯</div><div class='card'># 热搜第二：新歌首发大爆</div>`;
    if(tab === 'profile') {
        content = `
        <div style="margin-bottom:15px;display:flex;gap:5px;">
            <button class="sec" onclick="openPostUI('text')">📝 发帖子 (0精力, 效应低)</button>
            <button class="sec" onclick="openPostUI('video')">🎥 发视频 (耗5精, 效应强)</button>
        </div>
        <div id="socialProfileBody"><b>我的过往动态：</b><br>${posts[curApp].map(x=>`<div class='card' style='margin-top:5px;'>${x}</div>`).join('')}</div>`;
    }
    $("mTextList").innerHTML = nav + "<div id='socialContainer'>" + content + "</div>";
}

window.openPostUI = function(type) {
    let opts = `<option value="daily">分享日常生活</option>`;
    myWorks.forEach(w => opts += `<option value="tk_${w.id}">📺 打单宣传：${w.n}</option>`);
    albs.forEach(a => opts += `<option value="alb_${a.n}">💿 专辑宣传：${a.n}</option>`);

    $("socialContainer").innerHTML = `
        <h4 class="tg" style="margin-bottom:10px;">${type==='video'?'🎥 录制宣发视频 (需5精力)':'📝 编写帖子 (无消耗)'}</h4>
        <label style="font-size:12px;">宣传目标：</label>
        <select id="postTarget" style="margin-bottom:10px;width:100%;padding:8px;">${opts}</select>
        <textarea id="postContent" style="height:70px;" placeholder="写点什么配文..."></textarea>
        <button onclick="doPost('${type}')">立即发布</button>
    `;
}

window.doPost = function(type) {
    if(type === 'video' && !costEnergy(5)) return;
    let tgt = $("postTarget").value; let txt = escapeHTML($("postContent").value) || "分享生活！";
    let eff = type === 'video' ? 1.5 : 1.0;
    
    if(tgt.startsWith('tk_')) {
        let t = trackPool.find(x => x.id === tgt.replace('tk_',''));
        if(t) { t.stm += Math.floor(1000 * eff); t.rad += Math.floor(500 * eff); alert("宣传成功！歌曲播放量得到提振！"); }
    } else if (tgt.startsWith('alb_')) {
        alert("专辑宣传成功！带动了少量潜在销量！");
    } else { alert("日常发布成功！粉丝互动增加！"); ad.st.f += Math.floor(10 * eff); }

    posts[curApp].unshift(`<b>[${type==='video'?'视频':'图文'}]</b> ${txt}`);
    updAttr(); saveGame(); renderSocialTabs('profile');
}

function renderRankRow(x,i,valKey,valLabel){ let diff = x.lastW && x.lastW!==999 ? x.lastW-(i+1) : 0; let chg = diff>0?`<span class="rank-up">▲${diff}</span>`:diff<0?`<span class="rank-down">▼${-diff}</span>`:((!x.lastW || x.lastW===999)?'<span class="rank-new">NEW</span>':'-'); return `<div class="card" style="${x.isMe?'background:#fff8e0;':''}padding:10px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:16px;">#${i+1} <span style="font-size:12px;margin:0 4px;">${chg}</span></b><div style="text-align:right;">${escapeHTML(x.n)}<br><span style="font-size:11px;color:#888;">by ${escapeHTML(x.artist)}</span></div></div><div style="font-size:11px;color:#666;margin:4px 0;display:flex;justify-content:space-between;"><span>在榜: ${x.weeks}周</span><span>Peak: #${x.peakB||x.peakS}</span></div><b class="tg" style="font-size:12px;display:block;text-align:right;">${x[valKey].toLocaleString()} ${valLabel}</b></div>`; }

// ==================== 时间引擎与推演 ====================
function updTimeUI(){ let dMap = ["日","一","二","三","四","五","六"]; if($("uiDate")) $("uiDate").innerText = `${time.y}年 ${time.m}月 第${time.w}周 星期${dMap[time.d % 7]}`; if($("uiEnergy")) $("uiEnergy").innerText = ad.energy; }
function costEnergy(amt){ if(ad.energy < amt){ alert(`⚠️ 精力不足！`); return false; } ad.energy -= amt; updTimeUI(); return true; }
window.advHour = function(h){ for(let i=0; i<h; i++){ time.h++; if(time.h >= 24) { time.h=0; time.d++; ad.energy=ad.maxEnergy; } } if(time.d > 7) { time.d=1; advTime(1, false); } updTimeUI(); saveGame(); }
window.advTimeByFlow = function(){ advTime(1, true); }

function updatePeakRanks(){
  let activeTrks = trackPool.filter(x => x.type === "track" && !x.isSleeping && !x.isDead);
  activeTrks.sort((a,b)=>b.stm - a.stm); activeTrks.forEach((t,i)=>{ if(i+1<t.peakS){t.peakS=i+1;t.peakW=0;} if(i+1==t.peakS)t.peakW++; });
  activeTrks.sort((a,b)=>b.pts - a.pts); activeTrks.forEach((t,i)=>{ t.peakB = Math.min(t.peakB, i+1); t.lastW = i+1; });
}

function advTime(weeks, showMsg){
  let weekRev = 0;
  for(let step=0; step<weeks; step++){
    time.w++; if(time.w>4){ time.w=1; time.m++; genMarket(false); } if(time.m>12){ time.m=1; time.y++; }
    trackPool.forEach(t => {
      if(t.isDead) return;
      if(t.isSleeping) { t.stm = Math.floor(t.stm * 0.90); t.slWk = 0; t.pts = 0; if(!t.isMe && t.stm < 100) t.isDead = true; return; }
      t.stm = Math.floor(t.stm * 0.92); t.rad = Math.floor(t.rad * 0.95);
      if(t.type === "track") {
          t.stmDly = Math.floor(t.stm / 7); t.slWk = Math.floor(t.stm / 250); t.slTotal += t.slWk; t.pts = (t.slWk * 150) + t.stm + Math.floor(t.rad / 6);
          if(t.isMe) { let inc = Math.floor((t.slWk * t.price + t.stm * 0.005) * 0.8); weekRev += inc; let mw = myWorks.find(x=>x.id===t.id); if(mw) { mw.slTotal=t.slTotal; mw.revenue+=inc; } }
          if(t.weeks > 20 && t.lastW > 50) t.isSleeping = true;
      } else if(t.type === "album") {
          t.slWk = t.weeks === 1 ? Math.floor(t.stm/150) : Math.floor(t.stm / 1500); t.slTotal += t.slWk;
          if(t.isMe) { let inc = Math.floor((t.slWk * t.price + t.stm * 0.005) * 0.8); weekRev += inc; let mw = myWorks.find(x=>x.id===t.id); if(mw) { mw.slTotal=t.slTotal; mw.revenue+=inc; } }
      }
      t.weeks++;
    });
    if(step === weeks - 1) trackPool = trackPool.filter(x => !x.isDead);
  }
  ad.m += weekRev; updatePeakRanks(); updAttr(); saveGame();
  if(showMsg) alert(`⏩ 过了 ${weeks} 周！\n💰 赚取版税: $${weekRev.toLocaleString()}`); updTimeUI();
}

window.showMap = function(id){ ["mapLabel","mapMarket","mapFashion","mapHome"].forEach(x=>$(x).style.display="none"); $(id).style.display="block"; if(id=='mapLabel') renderMapCompany(); if(id=='mapMarket') renderMarket(); }
window.showProj = function(id){ ["pjSingle","pjAlbum"].forEach(x=>$(x).style.display="none"); $(id).style.display="block"; }
window.switchMainTab = function(btn, targetId){ document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active")); btn.classList.add("active"); document.querySelectorAll(".tab-page").forEach(x=>x.classList.remove("active")); $(targetId).classList.add("active"); }
window.closeM = function(id){ $(id).classList.remove("open"); }
window.relaxHome = function(){ advHour(1); ad.energy = Math.min(ad.maxEnergy, ad.energy + 20); updTimeUI(); saveGame(); }
function updAttr(){ if($("boxBasic")) $("boxBasic").innerHTML=`艺人:${escapeHTML(ad.s)} | 粉丝:<b class="tg">${ad.st?.f.toLocaleString()}</b> | 资金:$${ad.m?.toLocaleString()}<br>公司:${escapeHTML(ad.co)}`; $("boxBars").innerHTML=aKs.map(x=>`<div class="attr-row"><span>${x.n}</span><div class="attr-bar-wrap"><div class="attr-bar-fill" style="width:${ad.sk?ad.sk[x.k]:50}%"></div></div><b>${ad.sk?ad.sk[x.k]:50}</b></div>`).join(''); }

// API
window.saveApiConfig = function() { localStorage.setItem('savedApiEndpoint',$("apiHost").value); localStorage.setItem('savedApiKey',$("apiToken").value); alert("配置保存成功！"); }
window.loadApiConfig = function() { if (localStorage.getItem('savedApiEndpoint')) $("apiHost").value = localStorage.getItem('savedApiEndpoint'); if (localStorage.getItem('savedApiKey')) $("apiToken").value = localStorage.getItem('savedApiKey'); }
window.api = async function(p){ let tk=$("apiToken").value, m=$("apiModel").value||"gpt-3.5-turbo"; if(!tk) return null; try{ let r=await fetch($("apiHost").value.replace(/\/$/,'')+"/chat/completions", { method:"POST", headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json"}, body:JSON.stringify({model:m,messages:[{role:"system",content:"你是AI"}, {role:"user",content:p}]})}); let j=await r.json(); return j.choices[0].message.content; } catch(e){ return null; } }

window.onload = function(){ loadApiConfig(); }
</script>
